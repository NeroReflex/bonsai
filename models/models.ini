; Router-mode presets for llama-server.
; Each [section] is a model; the section name is what OpenCode / Open WebUI select.
; Keys are llama-server long option names without the leading dashes.

; Defaults applied to every model
[*]
n-gpu-layers = all
parallel = 1
batch-size = 2048
ubatch-size = 512
jinja = true
#threads = 8

; Bonsai 2 27B — GGUF
[Bonsai2-27B]
model = /models/bonsai2-27B/Ternary-Bonsai-2-27B-PQ2_0.gguf
ctx-size = 258048
cache-type-k = q8_0
cache-type-v = turbo2
temp = 1.0
top-p = 0.95
top-k = 20
min-p = 0.05
presence-penalty = 0.0
repetition_penalty=1.0
    
; Qwen3.8 27B - coding, with MTP but no vision
[qwen38-27b-No-vision]
model = /models/qwen3.8-27B/Qwen3.8-27B-UD-Q4_K_M.gguf
ctx-size = 131072
cache-type-k = q8_0
cache-type-v = turbo2
spec-type = draft-mtp
spec-draft-n-max = 3
temp = 1.0
top-p = 0.95
top-k = 20
min-p = 0.0
presence-penalty = 0.0
repetition_penalty=1.0

; Qwen3.8 27B - coding, with MTP and vision
[qwen38-27b-Vision]
model = /models/qwen3.8-27B/Qwen3.8-27B-UD-Q4_K_M.gguf
mmproj = /models/qwen3.8-27B/mmproj-F16.gguf
ctx-size = 131072
cache-type-k = q8_0
cache-type-v = turbo2
spec-type = draft-mtp
spec-draft-n-max = 3
temp = 1.0
top-p = 0.95
top-k = 20
min-p = 0.0
presence-penalty = 0.0
repetition_penalty=1.0
